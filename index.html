<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Remember Me</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at top, #273750 0%, #111827 43%, #080c14 100%);
      color: #f7f4ee;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    #game {
      width: min(920px, 100%);
      min-height: min(720px, calc(100vh - 36px));
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          rgba(17, 24, 39, 0.91),
          rgba(17, 24, 39, 0.97)
        );

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 26px;

      box-shadow:
        0 30px 100px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .scene {
      display: none;
      min-height: inherit;
      padding: 34px;
      position: relative;
      animation: sceneFade 0.5s ease;
    }

    .scene.active {
      display: flex;
      flex-direction: column;
    }

    @keyframes sceneFade {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .primary-btn,
    .soft-btn {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        background 0.15s ease;
    }

    .primary-btn {
      padding: 14px 27px;
      background: #f3e6dc;
      color: #202632;
      font-weight: 700;
      min-width: 142px;
    }

    .soft-btn {
      padding: 12px 20px;
      background: rgba(255,255,255,0.09);
      color: white;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .primary-btn:hover,
    .soft-btn:hover {
      transform: translateY(-2px);
    }

    .primary-btn:active,
    .soft-btn:active {
      transform: translateY(0);
    }

    /* =========================
       CHARM
    ========================= */

    .charm {
      width: 132px;
      height: 160px;
      margin: 15px auto 34px;
      border-radius: 44% 44% 40% 40%;
      border: 3px dashed rgba(255,255,255,0.72);

      background:
        linear-gradient(145deg, #ead9c9, #c9a98e);

      box-shadow:
        0 15px 45px rgba(0,0,0,0.4),
        inset 0 0 0 8px rgba(255,255,255,0.08);

      position: relative;
      animation: sway 3.2s ease-in-out infinite;
    }

    .charm::before {
      content: "";
      position: absolute;
      width: 38px;
      height: 28px;
      border-radius: 50%;
      border: 5px solid #b6a18f;
      top: -31px;
      left: 50%;
      transform: translateX(-50%);
    }

    .charm-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    @keyframes sway {
      0%,
      100% {
        transform: rotate(-2deg) translateY(0);
      }

      50% {
        transform: rotate(2deg) translateY(-5px);
      }
    }

    /* =========================
       OPENING
    ========================= */

    #opening {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .tiny-label {
      text-transform: uppercase;
      letter-spacing: 0.22em;
      opacity: 0.5;
      font-size: 0.72rem;
      margin-bottom: 18px;
    }

    .opening-text {
      min-height: 112px;
      max-width: 560px;
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      line-height: 1.7;
      margin: 0 auto 24px;
    }

    /* =========================
       AIRPORT
    ========================= */

    .airport-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 26px;
    }

    .airport-name {
      font-weight: 800;
      font-size: clamp(1.2rem, 4vw, 1.75rem);
    }

    .airport-sub {
      opacity: 0.5;
      margin-top: 4px;
      font-size: 0.86rem;
    }

    .airport-time {
      font-variant-numeric: tabular-nums;
      opacity: 0.7;
      text-align: right;
    }

    .window {
      min-height: 245px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);

      background:
        linear-gradient(
          to bottom,
          #829aac 0%,
          #a9bac7 46%,
          #c8cac5 47%,
          #a5a8a5 60%,
          #555d68 61%,
          #424955 100%
        );

      position: relative;
      margin-bottom: 24px;
    }

    .window::before,
    .window::after {
      content: "";
      position: absolute;
      background: rgba(25,34,45,0.5);
    }

    .window::before {
      width: 8px;
      top: 0;
      bottom: 0;
      left: 50%;
    }

    .window::after {
      height: 8px;
      left: 0;
      right: 0;
      top: 48%;
    }

    .plane {
      position: absolute;
      top: 32px;
      left: 18%;
      font-size: 2rem;
      opacity: 0.7;
      transform: rotate(-4deg);
    }

    .seat {
      position: absolute;
      right: 8%;
      bottom: 15px;
      width: 210px;
      height: 30px;
      border-radius: 10px;
      background: #252d39;
      opacity: 0.9;
    }

    .bag {
      position: absolute;
      right: 7%;
      bottom: 42px;
      font-size: 2.5rem;
    }

    .yako {
      position: absolute;
      right: 16%;
      bottom: 30px;
      font-size: clamp(4.2rem, 14vw, 6.5rem);
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.3));
      animation: yakoFloat 2.6s ease-in-out infinite;
      z-index: 5;
    }

    @keyframes yakoFloat {
      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-7px) rotate(2deg);
      }
    }

    .dialogue-box {
      margin-top: auto;
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 22px;
      min-height: 150px;
    }

    .speaker {
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      opacity: 0.42;
      margin-bottom: 10px;
    }

    .dialogue {
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      line-height: 1.65;
      min-height: 65px;
    }

    .dialogue-controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    /* =========================
       MATCH GAME
    ========================= */

    #matchScene {
      justify-content: center;
      text-align: center;
    }

    .charm-thought {
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      line-height: 1.7;
      min-height: 78px;
      max-width: 620px;
      margin: 0 auto 18px;
    }

    .target-emoji {
      display: block;
      font-size: 2.5rem;
      margin-top: 6px;
    }

    #matchBoard {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: min(430px, 100%);
      margin: 0 auto;
      user-select: none;
    }

    .tile {
      aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(1.65rem, 7vw, 2.6rem);
      cursor: pointer;

      background: rgba(255,255,255,0.07);

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        opacity 0.2s ease;
    }

    .tile:hover {
      background: rgba(255,255,255,0.11);
    }

    .tile.selected {
      background: rgba(255,255,255,0.2);
      transform: scale(0.92);
      outline: 2px solid rgba(255,255,255,0.55);
    }

    /* =========================
       MEMORY
    ========================= */

    #memoryScene {
      justify-content: center;
      text-align: center;
    }

    .memory-card {
      max-width: 650px;
      margin: auto;
      padding: 34px 30px;

      border-radius: 24px;
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .memory-icon {
      font-size: 4.5rem;
      margin-bottom: 20px;
    }

    .memory-text {
      min-height: 145px;
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      line-height: 1.75;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================
       REMEMBER PUZZLE
    ========================= */

    #rememberScene {
      justify-content: center;
      text-align: center;
    }

    .remember-card {
      max-width: 700px;
      width: 100%;
      margin: auto;
      padding: 32px 28px;

      border-radius: 24px;
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .back-charm {
      width: 180px;
      min-height: 210px;
      margin: 0 auto 28px;
      padding: 26px 18px;

      border-radius: 48px;
      border: 3px dashed rgba(255,255,255,0.72);

      background:
        linear-gradient(145deg, #ead9c9, #c9a98e);

      color: #272a31;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 17px;

      box-shadow:
        0 15px 45px rgba(0,0,0,0.35),
        inset 0 0 0 8px rgba(255,255,255,0.08);
    }

    .back-icons {
      font-size: 2.8rem;
    }

    .mystery-stitches {
      width: 110px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      opacity: 0.55;
    }

    .stitch-line {
      height: 3px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(
          90deg,
          #655346 0 8px,
          transparent 8px 13px
        );
    }

    .remember-dialogue {
      max-width: 570px;
      margin: 0 auto 26px;
      line-height: 1.75;
      font-size: clamp(1.02rem, 3vw, 1.25rem);
    }

    .letter-puzzle {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 4px;
      margin: 28px auto 18px;
      font-weight: 800;
    }

    .word-group {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      margin: 5px 9px;
    }

    .fixed-letter,
    .letter-box {
      width: 31px;
      height: 44px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: clamp(1.35rem, 5vw, 1.85rem);
      font-weight: 800;
    }

    .letter-box {
      border: 0;
      border-bottom: 2px solid rgba(255,255,255,0.62);
      border-radius: 0;
      outline: none;

      background: transparent;
      color: white;
      text-transform: uppercase;
      text-align: center;

      padding: 0;
      caret-color: white;
    }

    .letter-box:focus {
      border-bottom-color: #fff;
      background: rgba(255,255,255,0.04);
    }

    .letter-box.correct {
      border-bottom-color: rgba(255,255,255,0);
      animation: letterGlow 0.6s ease;
    }

    .letter-box.wrong {
      animation: shake 0.28s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes letterGlow {
      0% {
        text-shadow: none;
      }

      50% {
        text-shadow:
          0 0 10px white,
          0 0 22px rgba(255,255,255,0.7);
      }

      100% {
        text-shadow: none;
      }
    }

    .answer-feedback {
      min-height: 32px;
      opacity: 0.65;
      font-size: 0.9rem;
    }

    /* =========================
       REVEAL
    ========================= */

    #revealScene {
      justify-content: center;
      text-align: center;
    }

    .reveal-card {
      max-width: 650px;
      margin: auto;
      padding: 34px;

      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
    }

    .reveal-title {
      letter-spacing: 0.15em;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      margin: 10px 0 28px;
      animation: softGlow 2s ease-in-out infinite;
    }

    @keyframes softGlow {
      0%,
      100% {
        text-shadow: 0 0 0 rgba(255,255,255,0);
      }

      50% {
        text-shadow: 0 0 24px rgba(255,255,255,0.4);
      }
    }

    .reveal-text {
      min-height: 180px;
      line-height: 1.8;
      font-size: clamp(1.02rem, 3vw, 1.25rem);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        padding: 0;
      }

      #game {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .scene {
        padding: 22px 18px;
      }

      .window {
        min-height: 215px;
      }

      .yako {
        right: 14%;
      }

      .seat {
        width: 160px;
      }

      .dialogue-box {
        padding: 18px;
      }

      .tile {
        border-radius: 13px;
      }

      .memory-card,
      .remember-card,
      .reveal-card {
        padding: 24px 18px;
      }

      .fixed-letter,
      .letter-box {
        width: 27px;
        height: 40px;
      }

      .word-group {
        margin-left: 5px;
        margin-right: 5px;
      }
    }

  </style>
</head>

<body>

<main id="game">

  <!-- OPENING -->

  <section id="opening" class="scene active">

    <div class="tiny-label">
      Project Remember Me
    </div>

    <div class="charm">
      <div class="charm-face">🧵</div>
    </div>

    <div id="openingText" class="opening-text">
      ...

  </section>

  <!-- MEMORY -->

  <!-- REMEMBER ME -->

  <section id="rememberScene" class="scene">

      <div class="back-charm">

          🐙　🐇
        </div>

      </div>

      <div class="remember-dialogue">

        <br><br>

        There's something stitched on my back.

        <br><br>

        I can feel the letters,
        but I can't quite read them.

        <br>

        Maybe the real me can.

      </div>


      <div class="letter-puzzle">

        <div class="word-group">

          <span class="fixed-letter">R</span>

          <input
            class="letter-box missing-letter"
            maxlength="1"
            inputmode="text"
            autocomplete="off"

          />

            maxlength="1"

          <span class="fixed-letter">M</span>

          <input

            autocomplete="off"
            data-answer="E"
            aria-label="Missing letter"
          />

          <span class="fixed-letter">R</span>

        </div>


        <div class="word-group">

          <span class="fixed-letter">M</span>

          <input
            class="letter-box missing-letter"
            maxlength="1"
            inputmode="text"
            autocomplete="off"
            data-answer="E"
            aria-label="Missing letter"
          />

        </div>

      </div>

      <div
        id="answerFeedback"
        class="answer-feedback">

    </div>

  </section>


  <!-- REVEAL -->

  <section id="revealScene" class="scene">

    <div class="reveal-card">

      <div style="font-size:3rem;">
        🐙　🐇
      </div>

      <div class="reveal-title">
        REMEMBER ME
      </div>

      <div
        id="revealText"
        class="reveal-text">
      </div>

      <button
        id="revealNext"
        class="primary-btn">
        ...
      </button>

    </div>

  </section>

</main>


<script>

/* ======================================================
   SCENE CONTROL
====================================================== */

function showScene(id) {

  document
    .querySelectorAll(".scene")
    .forEach(scene => {
      scene.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

}


/* ======================================================
   OPENING
====================================================== */

const openingLines = [

  "...",

  "...ugh.",

  "Why is everything still moving?",

  "Wait.",

  "It's not moving anymore.",

  "So...",

  "Where am I?"

];


let openingIndex = 0;


const openingText =
  document.getElementById("openingText");

const openingButton =
  document.getElementById("openingButton");


openingButton.addEventListener(
  "click",
  () => {

    openingIndex++;

    if (
      openingIndex <
      openingLines.length
    ) {

      openingText.textContent =
        openingLines[openingIndex];

      openingButton.textContent =
        "...";

    }

    else {

      showScene("airportScene");

      startAirportDialogue();

    }

  }
);


/* ======================================================
   AIRPORT DIALOGUE
====================================================== */

  "Yako?",

  "...",

  "So that's her.",

  "I thought I'd recognise her somehow.",

  "...",

  "Something inside me feels all tangled up.",

  "Maybe the journey shook some things loose."

const airportNext =

function startAirportDialogue() {

  airportDialogueIndex = 0;

  airportDialogue.textContent =
    airportLines[0];

}


airportNext.addEventListener(

    airportDialogueIndex++;

    if (

    ) {

        airportLines[

    else {

   STORY MATCH PUZZLES
====================================================== */

const puzzleSteps = [

      "Something feels familiar...\nIs that...?",

    board: [

      ["🧵","🐇","📓","💾","✈️"],

      {
        icon: "🐇",
        text:
          "I remember him."
      },

      {

        text:
          "His hands kept moving while he was making me."
      },

      {
        icon: "💭",
        text:
          "And he talked. A lot."
      }

    ]
  },


  {
    target: "🐙",

    thought:
      "Wait...\nThere's another one.",

    board: [

      ["📓","💾","🐙","✈️","🧵"],
      ["🐇","💾","🐙","💾","✈️"],
      ["🐙","📓","💾","🧵","🐇"],
      ["🐙","✈️","🐙","📓","🐙"],
      ["🧵","✈️","🧵","📓","💾"]

    ],

    memories: [

      {
        icon: "🐙",
        text:

      },

      {

const size = 5;

let puzzleIndex = 0;

let board = [];

let selected = null;

let boardLocked = false;

let puzzleMemoryIndex = 0;


const boardElement =
  document.getElementById("matchBoard");

const targetEmoji =
  document.getElementById("targetEmoji");

const matchThought =
  document.getElementById("matchThought");


function createBoard() {

  selected = null;

  boardLocked = false;

  const step =
    puzzleSteps[puzzleIndex];

  board =
    step.board.map(
      row => [...row]
    );

  matchThought.innerHTML =
    step.thought
      .replace(/\n/g, "<br>") +
    `<span class="target-emoji">${step.target}</span>`;

  renderBoard();

}


function renderBoard() {

  boardElement.innerHTML = "";

  for (
    let row = 0;
    row < size;
    row++
  ) {

    for (
      let col = 0;
      col < size;
      col++
    ) {

      const tile =
        document.createElement("div");

      tile.className =
        "tile";

      tile.textContent =
        board[row][col];


      if (
        selected &&
        selected.row === row &&
        selected.col === col
      ) {

        tile.classList.add(
          "selected"
        );

      }


      tile.addEventListener(
        "click",
        () =>
          handleTileClick(
            row,
            col
          )
      );


      boardElement.appendChild(
        tile
      );

    }

  }

}


function handleTileClick(
  row,
  col
) {

  if (boardLocked) {
    return;
  }


  if (!selected) {

    selected = {
      row,
      col
    };

    renderBoard();

    return;

  }


  if (
    selected.row === row &&
    selected.col === col
  ) {

    selected = null;

    renderBoard();

    return;

  }


  const distance =
    Math.abs(
      selected.row - row
    ) +
    Math.abs(
      selected.col - col
    );


  if (
    distance !== 1
  ) {

    selected = {
      row,
      col
    };

    renderBoard();

    return;

  }


  const previous = {
    ...selected
  };


  selected = null;


  swapTiles(
    previous.row,
    previous.col,
    row,
    col
  );


  const matches =
    findMatches();


  if (
    matches.length === 0
  ) {

    swapTiles(
      previous.row,
      previous.col,
      row,
      col
    );

    renderBoard();

    return;

  }


  const target =
    puzzleSteps[
      puzzleIndex
    ].target;


  const containsTarget =
    matches.some(
      ({row, col}) =>
        board[row][col] ===
        target
    );


  if (!containsTarget) {

    swapTiles(
      previous.row,
      previous.col,
      row,
      col
    );

    renderBoard();

    return;

  }


  solvePuzzle(matches);

}


function swapTiles(
  r1,
  c1,
  r2,
  c2
) {

  const temp =
    board[r1][c1];

  board[r1][c1] =
    board[r2][c2];

  board[r2][c2] =
    temp;

}


function findMatches() {

  const matched =
    new Set();


  /* Horizontal */

  for (
    let row = 0;
    row < size;
    row++
  ) {

    let start = 0;


    for (
      let col = 1;
      col <= size;
      col++
    ) {

      if (
        col < size &&
        board[row][col] ===
        board[row][start]
      ) {

        continue;

      }


      const length =
        col - start;


      if (
        length >= 3
      ) {

        for (
          let x = start;
          x < col;
          x++
        ) {

          matched.add(
            `${row},${x}`
          );

        }

      }


      start = col;

    }

  }


  /* Vertical */

  for (
    let col = 0;
    col < size;
    col++
  ) {

    let start = 0;


    for (
      let row = 1;
      row <= size;
      row++
    ) {

      if (
        row < size &&
        board[row][col] ===
        board[start][col]
      ) {

        continue;

      }


      const length =
        row - start;


      if (
        length >= 3
      ) {

        for (
          let y = start;
          y < row;
          y++
        ) {

          matched.add(
            `${y},${col}`
          );

        }

      }


      start = row;

    }

  }


  return Array
    .from(matched)
    .map(item => {

      const [row, col] =
        item
          .split(",")
          .map(Number);

      return {
        row,
        col
      };

    });

}


async function solvePuzzle(
  matches
) {

  boardLocked = true;


  matches.forEach(
    ({row, col}) => {

      board[row][col] =
        "✨";

    }
  );


  renderBoard();


  await sleep(550);


  startPuzzleMemory();

}


function startPuzzleMemory() {

  puzzleMemoryIndex = 0;

  memoryNext.dataset.mode =
    "puzzle";

  displayPuzzleMemory();

  showScene(
    "memoryScene"

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

/* ======================================================
   REMEMBER ME LETTER PUZZLE
====================================================== */

const letterBoxes =
  Array.from(
    document.querySelectorAll(
      ".missing-letter"
    )
  );


const answerFeedback =
  document.getElementById(
    "answerFeedback"
  );


let rememberSolved =
  false;


letterBoxes.forEach(
  (box, index) => {

    box.addEventListener(
      "input",
      () => {

        if (
          rememberSolved
        ) {
          return;
        }


        let value =
          box.value
            .replace(
              /[^a-zA-Z]/g,
              ""
            )
            .slice(0, 1)
            .toUpperCase();


        box.value =
          value;


        if (!value) {
          return;
        }


        const expected =
          box.dataset.answer;


        if (
          value !== expected
        ) {

          box.classList.remove(
            "wrong"
          );

          void box.offsetWidth;

          box.classList.add(
            "wrong"
          );


          answerFeedback.textContent =
            "Hmm... that doesn't feel right.";


          setTimeout(
            () => {

              box.value = "";

              box.classList.remove(
                "wrong"
              );

            },
            280
          );


          return;

        }


        box.classList.add(
          "correct"
        );


        answerFeedback.textContent =
          "";


        if (
          index <
          letterBoxes.length - 1
        ) {

          letterBoxes[
            index + 1
          ].focus();

        }


        checkLetterPuzzle();

      }
    );


    box.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Backspace" &&
          box.value === "" &&
          index > 0
        ) {

          letterBoxes[
            index - 1
          ].focus();

        }

      }
    );

  }
);


function checkLetterPuzzle() {

  const solved =
    letterBoxes.every(
      box =>
        box.value
          .toUpperCase() ===
        box.dataset.answer
    );


  if (!solved) {
    return;
  }


  rememberSolved =
    true;


  letterBoxes.forEach(
    box => {

      box.disabled =
        true;

    }
  );


  answerFeedback.textContent =
    "...Oh.";


  setTimeout(
    () => {

      startRevealScene();

    },
    1200
  );

}
